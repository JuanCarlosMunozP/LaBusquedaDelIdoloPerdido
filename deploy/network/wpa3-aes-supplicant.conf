# ============================================================================
# PROYECTO: La Búsqueda del Ídolo Perdido — Seguridad Informática
# ARCHIVO:  deploy/network/wpa3-aes-supplicant.conf
# SEMANA:   Semana 3 — Perímetro Inalámbrico con Cifrado WiFi Robusto
# DESCRIPCIÓN: Configuración de enlace inalámbrico en Raspberry Pi (wlan0)
#              exigiendo WPA2/WPA3 con cifrado AES (CCMP) y PMF obligatorio,
#              prohibiendo protocolos débiles (WEP, TKIP, Open).
# ============================================================================

ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=0
country=CO

# Perfil 1: WPA3-Personal (SAE) / WPA2-PSK en modo transición con AES-CCMP
network={
    ssid="LAB_SEGURIDAD_MULTIMEDIA"
    proto=RSN
    key_mgmt=SAE WPA-PSK-SHA256
    pairwise=CCMP
    group=CCMP
    # Protected Management Frames (802.11w) obligatorio contra ataques de deautenticación
    ieee80211w=2
    psk="ClaveInalambricaRobusta#2026"
}

# Perfil 2: WPA2/WPA3-Enterprise (802.1X con validación RADIUS / EAP-TLS)
network={
    ssid="CORP_IDOLO_ZERO_TRUST"
    proto=RSN
    key_mgmt=WPA-EAP-SUITE-B-192 WPA-EAP-SHA256
    pairwise=GCMP-256 CCMP
    group=GCMP-256 CCMP
    eap=TLS
    identity="raspberry-gateway@seguridad.local"
    ca_cert="/etc/ssl/certs/lab-radius-ca.pem"
    client_cert="/etc/ssl/certs/raspberry-client.pem"
    private_key="/etc/ssl/private/raspberry-client.key"
    ieee80211w=2
}
