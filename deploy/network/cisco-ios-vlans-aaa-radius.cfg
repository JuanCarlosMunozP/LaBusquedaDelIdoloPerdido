! ============================================================================
! PROYECTO: La Búsqueda del Ídolo Perdido — Seguridad Informática
! ARCHIVO:  deploy/network/cisco-ios-vlans-aaa-radius.cfg
! SEMANAS:  Semana 3 (Segmentación Lógica VLANs), Semana 4 (AAA + Zero Trust + Fallback)
!           y Semana 6 (ACL Default Deny aplicada con ip access-group)
! EQUIPO:   Switch Multicapa L3 / Router Cisco IOS (Compatible con Packet Tracer / GNS3)
! ============================================================================

enable
configure terminal

! ----------------------------------------------------------------------------
! 1. HARDENING BASE DEL EQUIPAMIENTO DE RED
! ----------------------------------------------------------------------------
hostname SW-CORE-IDOLO
service password-encryption
no ip domain-lookup
no ip http server
no ip http secure-server
security passwords min-length 10
login block-for 120 attempts 3 within 60
ip routing

! Usuario local de contingencia (Fallback) con derivación segura (scrypt/PBKDF2)
username admin_contingencia privilege 15 algorithm-type scrypt secret ClaveContingencia#2026
username operador_lectura privilege 5 algorithm-type scrypt secret OperadorLectura#2026

! ----------------------------------------------------------------------------
! 2. SEMANA 3 — SEGMENTACIÓN LÓGICA EN CAPA 2 (VLANs ESTRUCTURADAS)
!    Aislamiento de dominios de difusión para bloquear movimiento lateral
! ----------------------------------------------------------------------------
vlan 10
 name VLAN_USUARIOS_VENTAS_JUGADORES
exit

vlan 20
 name VLAN_SERVIDORES_CRITICOS
exit

vlan 99
 name VLAN_GESTION_INFRAESTRUCTURA
exit

vlan 666
 name VLAN_QUARANTINE_BLACKHOLE
 shutdown
exit

! Puertos de Acceso para Usuarios / Jugadores (VLAN 10) con Port-Security
interface range FastEthernet0/1 - 12
 description PUERTOS_USUARIOS_Y_JUGADORES
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
exit

! Puerto dedicado al Servidor Crítico Raspberry Pi / Docker Host (VLAN 20)
interface GigabitEthernet0/1
 description SERVIDOR_CRITICO_RASPBERRY_PI_BACKEND
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
exit

! Enlace Troncal 802.1Q hacia Firewall / Router de Borde (Solo VLANs autorizadas)
interface GigabitEthernet0/2
 description TRUNK_8021Q_HACIA_FIREWALL
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 switchport nonegotiate
 no shutdown
exit

! Apagar puertos no utilizados y enviarlos a VLAN Blackhole (Default Deny físico)
interface range FastEthernet0/13 - 24
 description PUERTOS_DESHABILITADOS_POR_SEGURIDAD
 switchport mode access
 switchport access vlan 666
 shutdown
exit

! ----------------------------------------------------------------------------
! 3. SEMANA 4 — MODELO AAA CENTRALIZADO (IAM RADIUS), ZERO TRUST Y FALLBACK
!    Separa explícitamente Autenticación (quién entra), Autorización (RBAC)
!    y Contabilidad (Accounting), con contingencia local ante caída del IAM
! ----------------------------------------------------------------------------
aaa new-model

! Definición del Servidor IAM Centralizado (RADIUS)
radius server IAM_CENTRAL_RADIUS
 address ipv4 192.168.20.10 auth-port 1812 acct-port 1813
 timeout 3
 retransmit 2
 key 0 RadiusSecretLab#2026
exit

ip radius source-interface Vlan99

! Mecanismo de Contingencia (Fallback): consulta primero RADIUS; si cae, usa base local
aaa authentication login default group radius local
aaa authentication enable default group radius enable

! Filosofía Zero Trust y Menor Privilegio: Autorización de sesión y comandos por rol (RBAC)
aaa authorization console
aaa authorization exec default group radius local if-authenticated
aaa authorization commands 1 default group radius local
aaa authorization commands 15 default group radius local

! Auditoría Forense (Accounting) de inicios de sesión y comandos ejecutados
aaa accounting exec default start-stop group radius
aaa accounting commands 15 default start-stop group radius
aaa accounting connection default start-stop group radius

! ----------------------------------------------------------------------------
! 4. SEMANA 6 — CONTROL DE ACCESO ENTRE SEGMENTOS (ACL DEFAULT DENY APLICADA)
!    Los usuarios (VLAN 10) solo pueden alcanzar HTTPS (443/8443) del servidor,
!    bloqueando acceso directo a PostgreSQL (5432), FastAPI (8000) o SSH (22)
! ----------------------------------------------------------------------------
ip access-list extended ACL_USUARIOS_A_SERVIDORES
 remark Permitir exclusivamente trafico HTTPS cifrado hacia el Gateway Nginx
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.20.50 eq 443
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.20.50 eq 8443
 remark Bloquear explicitamente acceso directo a PostgreSQL y FastAPI interno
 deny   tcp any host 192.168.20.50 eq 5432 log
 deny   tcp any host 192.168.20.50 eq 8000 log
 deny   tcp 192.168.10.0 0.0.0.255 host 192.168.20.50 eq 22 log
 remark Politica por defecto Default Deny con registro de auditoria
 deny   ip any any log
exit

! Aplicación efectiva de la ACL en la interfaz SVI de Usuarios (VLAN 10)
interface Vlan10
 description SVI_GATEWAY_USUARIOS_JUGADORES
 ip address 192.168.10.1 255.255.255.0
 ip access-group ACL_USUARIOS_A_SERVIDORES in
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no shutdown
exit

interface Vlan20
 description SVI_GATEWAY_SERVIDORES_CRITICOS
 ip address 192.168.20.1 255.255.255.0
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no shutdown
exit

interface Vlan99
 description SVI_GESTION_INFRAESTRUCTURA
 ip address 192.168.99.1 255.255.255.0
 no shutdown
exit

! Acceso administrativo a líneas VTY solo por SSH v2 cifrado
ip ssh version 2
line vty 0 4
 login authentication default
 transport input ssh
 exec-timeout 5 0
exit

end
write memory
