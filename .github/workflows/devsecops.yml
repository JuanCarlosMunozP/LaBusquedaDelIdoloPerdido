name: DevSecOps — CI/CD, SAST/SCA & Container Security (Aqua Trivy)

on:
  push:
    branches: ["main", "dev/**", "dev-*"]
  pull_request:
    branches: ["main", "dev/**", "dev-*"]

permissions:
  contents: read
  security-events: write

jobs:
  unit-and-security-tests:
    name: 1. Pruebas Automatizadas (Frontend Vitest + Backend Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y ejecutar suites de seguridad Frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias y ejecutar suites Clean Architecture + Seguridad Backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

  trivy-sast-sca-config:
    name: 2. Escaneo SAST/SCA y Configuraciones IaC (Aqua Trivy FS)
    runs-on: ubuntu-latest
    needs: unit-and-security-tests
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Aqua Trivy en repositorio (Dependencias, Secretos y Docker/Compose)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  trivy-container-scan:
    name: 3. Escaneo de Imágenes Docker Endurecidas (Aqua Trivy Image)
    runs-on: ubuntu-latest
    needs: trivy-sast-sca-config
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker Gateway Frontend + Nginx TLS
        run: docker build -f frontend/Dockerfile -t idolo-nginx:ci .

      - name: Escanear imagen idolo-nginx:ci con Aqua Trivy (Falla controlada en CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "idolo-nginx:ci"
          format: "table"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Construir imagen Docker Backend FastAPI Clean Architecture
        run: docker build -f backend/Dockerfile -t idolo-fastapi:ci ./backend

      - name: Escanear imagen idolo-fastapi:ci con Aqua Trivy (Falla controlada en CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "idolo-fastapi:ci"
          format: "table"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
