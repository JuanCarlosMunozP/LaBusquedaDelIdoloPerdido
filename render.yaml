# Blueprint de Render — plan gratuito, un servicio Docker (Nginx + FastAPI) y PostgreSQL.
#   Internet -> LaBusquedaDelIdoloPerdido (nginx -> FastAPI en loopback; acceso publico) -> busquedadelidolodb
# Se adoptan los recursos ya creados en Render (mismos nombres).
# Raspberry y VPS siguen usando compose*.yaml y no se ven afectados.

services:
  - type: web
    name: LaBusquedaDelIdoloPerdido
    runtime: docker
    region: oregon
    plan: free
    branch: dev-juan
    dockerfilePath: ./frontend/Dockerfile.render
    dockerContext: ./
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: busquedadelidolodb
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEPLOY_TARGET
        value: render
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_AUDIT_TOKEN
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CSRF_PROTECTION_ENABLED
        value: "true"
      - key: SESSION_TTL_SECONDS
        value: "28800"
      - key: ARGON2_TIME_COST
        value: "3"
      - key: ARGON2_MEMORY_COST
        value: "65536"
      - key: ARGON2_PARALLELISM
        value: "2"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"

databases:
  - name: busquedadelidolodb
    region: oregon
    plan: free
    ipAllowList: []
